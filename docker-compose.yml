# Local development only. There is no production database yet (roadmap D5);
# when there is, the only file that changes is src/lib/db/client.ts, which
# names the three settings that move and why.
#
# Why Docker rather than the postgresql-16 already installed on this machine:
# that cluster is on port 5433, has no `miftah` role, and its pg_hba.conf is
# root-only -- creating a role there needs an interactive sudo password, which
# turns setup from a script into a conversation. Docker needs none.
services:
  postgres:
    # 16 to match the psql 16.11 already on PATH, so client and server never
    # disagree. gen_random_uuid() is core in PG13+, so the schema's
    # `default gen_random_uuid()` needs no CREATE EXTENSION pgcrypto.
    image: postgres:16-alpine
    container_name: jmtarot-pg
    # WSL has systemd enabled, so the container comes back after a WSL restart
    # and `npm run db:up` is a no-op rather than a chore every morning.
    restart: unless-stopped
    environment:
      POSTGRES_USER: jmtarot
      # Committed on purpose, and deliberately trivial: this container binds to
      # loopback and holds nothing but seeded fiction. IT MUST NEVER BE REUSED
      # FOR ANYTHING. Alphanumeric on purpose too -- a `$` in a password inside
      # a .env file gets expanded away by Next exactly the way the bcrypt
      # hashes did, and `@ : / ?` would need percent-encoding in the URL.
      POSTGRES_PASSWORD: jmtarot
      POSTGRES_DB: jmtarot
    # 127.0.0.1, not 0.0.0.0. WSL2's NAT would otherwise expose this to the
    # Windows host and to anything that can reach it.
    ports: ['127.0.0.1:5432:5432']
    volumes: ['jmtarot-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jmtarot -d jmtarot']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- V9: a real Upstash REST endpoint, offline ----------------------------
  #
  # NO VOLUME, deliberately: a limiter's whole state is a few sliding windows
  # that expire within the hour, so persisting them across restarts would only
  # let one test run's keys leak into the next.
  redis:
    image: redis:7-alpine
    container_name: jmtarot-redis
    restart: unless-stopped
    # **NO PUBLISHED PORT, AND NOT ONLY FOR TIDINESS.** 6379 on this machine is
    # permanently held by another project's `chatbot-redis` container, bound to
    # 0.0.0.0 -- the same situation as port 3000 and its Grafana. Publishing it
    # here fails with "port is already allocated" and the plan's compose snippet
    # does exactly that.
    #
    # Nothing needs it: `srh` reaches this over the compose network by service
    # name, and the integration suite only ever talks to `srh` on 8079. Leaving
    # it unpublished removes a conflict AND a hole rather than trading one for
    # the other.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  srh:
    # `serverless-redis-http` speaks Upstash's REST protocol against a real
    # Redis, so the integration suite exercises THE ACTUAL LUA SLIDING WINDOW
    # rather than a mock of it -- which is the only thing worth testing here,
    # because the property under test is atomicity across two callers.
    #
    # It needs no Upstash account and no network beyond the one-time image pull,
    # same as postgres:16.
    image: hiett/serverless-redis-http:latest
    container_name: jmtarot-srh
    restart: unless-stopped
    # 8079, because 8080 is a coin toss on any developer machine and this one
    # already has 3000 permanently taken by another project's Grafana.
    ports: ['127.0.0.1:8079:80']
    environment:
      SRH_MODE: env
      # A fixed token, committed on purpose and deliberately trivial, exactly
      # like the postgres password above: this binds to loopback and holds
      # nothing but expiring counters. IT MUST NEVER BE REUSED.
      SRH_TOKEN: jmtarot-test-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  jmtarot-pgdata:
